[package]
name = "jmux"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "jmux"
path = "src/main.rs"

[dependencies]
jtui = { path = "../crates/jtui" }
crossterm = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }
