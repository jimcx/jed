[package]
name = "jed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
git2 = { version = "0.21", default-features = false }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
ignore = "0.4.33"
libc = "0.2.190"
lsp-types = "0.97.0"
notify = "8.2.0"
nucleo = "0.5.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.2.9"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cmake = "0.7.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-json = "0.24.8"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tui-term = "0.3.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
