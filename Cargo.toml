[package]
name = "jed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
git2 = { version = "0.21", default-features = false }
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-searcher = "0.1.17"
ignore = "0.4.34"
libc = "0.2.191"
lsp-types = "0.97.0"
memchr = "2.8.3"
notify = "9.0.0-rc.7"
nucleo = "0.5.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf"] }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "net"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.3.0"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cmake = "0.7.6"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-gitcommit = "0.5.0"
tree-sitter-ini = "1.4.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.4"
tree-sitter-objc = "3.0.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tui-term = { version = "0.3.4", default-features = false }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
vt100 = { version = "0.18.1", features = ["compress"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
spellbook = "0.4.2"
zstd = "0.14.3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[build-dependencies]
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true

# jed's crossterm fork (https://github.com/jimcx/crossterm, branch `fwdback`): upstream 0.29 drops
# SGR mouse buttons 8 / 9 (the mouse's back / forward buttons) with "We do not support other
# buttons". On a crossterm upgrade, rebase `fwdback` onto the new release and re-apply the patch
# (`MouseButton::Back` / `Forward`, their `parse_cb` arms).
[patch.crates-io]
crossterm = { git = "https://github.com/jimcx/crossterm.git", tag = "0.29+fwdback" }
# jed's vt100 fork (based on 0.18.1): adds `Screen::mark_prompt` / `clear_before_prompt` and
# `Screen::scrolled_lines` (lines ever pushed into the scrollback, for the terminal selection to
# follow its text) and the `compress` feature (zstd-compressed old scrollback rows, `Screen::set_scrollback_compression`;
# rows evicted while compressed skip the `on_row` callback). On a vt100 upgrade, rebase the fork's `jed` changes onto the new release and
# re-tag.
vt100 = { git = "https://github.com/jimcx/vt100-rust.git", tag = "v0.18.1+jed4" }

# Dependencies (ropey, ratatui, tree-sitter and its C grammars, regex, …) build optimised and
# without their debug assertions in dev and test builds: the tests spent most of their CPU in
# them (ropey re-validates a chunk's UTF-8 on every chunk lookup in debug). jed's own code keeps
# opt-level 0 and its debug assertions, so incremental rebuilds stay fast; only the first build
# after a dependency change is slower.
[profile.dev.package."*"]
opt-level = 2
debug-assertions = false
