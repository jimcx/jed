name: Build

# Branches only: a version tag doesn't rebuild, release.yml publishes the
# tarballs this workflow built for the tagged commit on main.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and components; install it explicitly
      # (rustup no longer installs a missing toolchain on first use everywhere).
      # The Gitea runner image has no rustup, so bootstrap it there; the runner
      # keeps ~/.rustup and ~/.cargo in persistent volumes, so the bootstrap and
      # toolchain download only happen once.
      - name: Install toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.GITEA_ACTIONS }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release -p jed -p jmux

      - name: Test
        run: scripts/timeout 900 cargo test --workspace

      - name: Package
        shell: bash
        run: |
          os=$([ "$RUNNER_OS" = macOS ] && echo macos || echo linux)
          # One tarball per binary (jed-<os>-<arch>, jmux-<os>-<arch>), both in the one artifact (dist-<os>-<arch>).
          echo "ARTIFACT=dist-$os-$(uname -m)" >> "$GITHUB_ENV"
          # Cargo's strip = true can fail with only a warning (rust-objcopy), so make sure.
          strip target/release/jed target/release/jmux
          mkdir -p dist
          for bin in jed jmux; do
            tar -czf "dist/$bin-$os-$(uname -m).tar.gz" -C target/release "$bin"
          done

      # release.yml downloads these from the tagged commit's run, so they must
      # outlive the gap between a push to main and its release tag.
      - uses: actions/upload-artifact@v4
        if: ${{ !env.GITEA_ACTIONS }}
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*.tar.gz
          retention-days: 90

