name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version and components; install it explicitly
      # (rustup no longer installs a missing toolchain on first use everywhere).
      # The Gitea runner image has no rustup, so bootstrap it there; the runner
      # keeps ~/.rustup and ~/.cargo in persistent volumes, so the bootstrap and
      # toolchain download only happen once.
      - name: Install toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: scripts/timeout 900 cargo test

      - name: Package
        shell: bash
        run: |
          os=$([ "$RUNNER_OS" = macOS ] && echo macos || echo linux)
          pkg="jed-$os-$(uname -m)"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          # Cargo's strip = true can fail with only a warning (rust-objcopy), so make sure.
          strip target/release/jed
          mkdir -p dist
          tar -czf "dist/$pkg.tar.gz" -C target/release jed

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/*.tar.gz

  # A version tag (git tag v0.1.0 && git push origin v0.1.0) publishes a release
  # with both platforms' tarballs, once every build and test has passed. The notes
  # are a changelog of the commits and tasks completed since the previous
  # release (scripts/changelog, shared with the release command).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Changelog
        run: scripts/changelog > "$RUNNER_TEMP/changelog.md"

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file "$RUNNER_TEMP/changelog.md" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
