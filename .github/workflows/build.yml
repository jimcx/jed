name: Build

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Gitea job containers are thrown away after each run, so cache the pinned
      # toolchain (the image's stable one is baked in, so leave it out). GitHub's
      # downloads are fast enough not to spend cache space on it.
      - name: Cache toolchain
        if: ${{ env.GITEA_ACTIONS }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # rust-toolchain.toml pins the version and components; install it explicitly
      # (rustup no longer installs a missing toolchain on first use everywhere).
      # Runner images normally ship rustup, as GitHub's do; bootstrap it on one
      # that doesn't.
      - name: Install toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release -p jed -p jmux

      # Each multi-thread tokio test runtime starts a worker per CPU and a test runs per CPU:
      # CPUs² threads, past a Gitea container's process limit. scripts/check does the same.
      - name: Test
        env:
          TOKIO_WORKER_THREADS: 2
        run: scripts/timeout 900 cargo test --workspace

      - name: Package
        shell: bash
        run: |
          os=$([ "$RUNNER_OS" = macOS ] && echo macos || echo linux)
          # One tarball per binary (jed-<os>-<arch>, jmux-<os>-<arch>), both in the one artifact (dist-<os>-<arch>).
          echo "ARTIFACT=dist-$os-$(uname -m)" >> "$GITHUB_ENV"
          # Cargo's strip = true can fail with only a warning (rust-objcopy), so make sure.
          strip target/release/jed target/release/jmux
          mkdir -p dist
          for bin in jed jmux; do
            tar -czf "dist/$bin-$os-$(uname -m).tar.gz" -C target/release "$bin"
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !env.GITEA_ACTIONS }}
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*.tar.gz

  # A version tag (v<N>, pushed by the release command) publishes a release with
  # both platforms' tarballs (jed and jmux), once every build and test has
  # passed. The tag's own run builds them rather than reusing main's: build.rs
  # names the version from the tag on HEAD, so only a build on the tag says
  # v<N> on the splash and in --version. The notes are a changelog of the
  # commits and tasks completed since the previous release (scripts/changelog,
  # shared with the release command).
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Changelog
        run: scripts/changelog > "$RUNNER_TEMP/changelog.md"

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file "$RUNNER_TEMP/changelog.md" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
